      <line x1="13.5" y1="0" x2="13.5" y2="29" stroke="#3E2D0B" stroke-opacity="0.48" stroke-width="1"/>
      <line x1="26.5" y1="0" x2="26.5" y2="29" stroke="#3E2D0B" stroke-opacity="0.48" stroke-width="1"/>
      <line x1="0" y1="14.5" x2="13.5" y2="14.5" stroke="#3E2D0B" stroke-opacity="0.48" stroke-width="1"/>
      <line x1="26.5" y1="14.5" x2="40" y2="14.5" stroke="#3E2D0B" stroke-opacity="0.48" stroke-width="1"/>
      <rect x="13.5" y="7" width="13" height="15" rx="2" stroke="#3E2D0B" stroke-opacity="0.48" stroke-width="1"/>
