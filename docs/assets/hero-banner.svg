    <path d="M1094 173C1097 176 1097 183 1094 186" stroke="#D6B46A" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.72"/>
    <path d="M1100 169C1105 174 1105 185 1100 190" stroke="#D6B46A" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"/>

    <!-- Bottom Row: Account Mask + Network -->
    <text x="752" y="274" fill="#F5F5F5" fill-opacity="0.86" font-family="monospace" font-size="12" font-weight="500" letter-spacing="1.2">PHYSICAL CASH VAULT</text>
    <text x="1110" y="274" text-anchor="end" fill="#F0D9A0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">CASH</text>
