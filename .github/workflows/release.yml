name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/hisabi-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/hisabi-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Djava.awt.headless=true
        run: ./gradlew :app:assembleRelease

      - name: Rename release APK
        run: |
          APK_DIR="app/build/outputs/apk/release"
          SIGNED_APK="$APK_DIR/app-release.apk"
          if [ ! -f "$SIGNED_APK" ]; then
            echo "::error::Signed APK not found at $SIGNED_APK. Contents of $APK_DIR:"
            ls -la "$APK_DIR" || true
            exit 1
          fi
          mv "$SIGNED_APK" "$APK_DIR/Hisabi-${GITHUB_REF_NAME}.apk"

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hisabi-release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/Hisabi-${{ github.ref_name }}.apk
          generate_release_notes: true
